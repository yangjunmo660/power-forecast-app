name: Fetch Power Data
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 15 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    ...
      - name: Commit and push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add power_realtime.json weather_realtime.json forecast_30d_*.csv
          git diff --staged --quiet || git commit -m "Update realtime data [skip ci]"
          git pull --rebase origin main
          git push
